unbind r
bind r source-file ~/.config/tmux/tmux.conf
bind-key L switch-client -l   
set -g prefix C-b
set -g status-left-length 40
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 50000
set -g mouse on
set -g status-right ""

set-option -g status-position top

# Install/load plugins from ~/.tmux/plugins. Without this, tpm defaults to
# ~/.config/tmux/plugins because the config lives under XDG — and that dir is a
# stow symlink into the dotfiles repo, so plugins would get vendored in by accident.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'

set -g @catppuccin_status_modules_right ""

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

# Keep this as the LAST line: tpm loads every @plugin above (catppuccin included).
run '~/.tmux/plugins/tpm/tpm'

